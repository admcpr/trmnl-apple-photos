name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ZIP_NAME: apple-photos-plugin.zip

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Same major as TRMNL's Serverless runtime.
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build transform.js and run tests
        run: npm test

      - name: Check the committed transform.js is up to date
        run: |
          if ! git diff --exit-code -- ../plugin/src/transform.js; then
            echo "::error::plugin/src/transform.js is stale. Run 'npm run build:serverless' in worker/ and commit the result."
            exit 1
          fi

      - name: Build plugin zip
        working-directory: plugin/src
        run: zip -r "$GITHUB_WORKSPACE/$ZIP_NAME" .

      - uses: actions/upload-artifact@v4
        with:
          name: apple-photos-plugin
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error

  release:
    name: Publish plugin zip
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apple-photos-plugin

      - name: Point the "latest" tag at this commit
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Update the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          make_latest: true
          body: |
            TRMNL private plugin zip, built from `${{ github.sha }}`.

            Import it at **Plugins → Private Plugin → Import new** on trmnl.com, then paste
            `transform.js` into the plugin's Serverless editor (language: Node) if the import
            did not pick it up. See the README for setup.
          files: ${{ env.ZIP_NAME }}
